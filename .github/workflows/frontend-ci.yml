name: Frontend CI & E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    name: Lint & Build Next.js App
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SERVER_URL: https://idea-vault-a09-server.vercel.app
      BETTER_AUTH_SECRET: ci-test-secret-value-32-chars-long!!
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  e2e-tests:
    name: Cypress E2E Tests
    needs: lint-and-build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SERVER_URL: https://idea-vault-a09-server.vercel.app
      BETTER_AUTH_SECRET: ci-test-secret-value-32-chars-long!!
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
          record: false

